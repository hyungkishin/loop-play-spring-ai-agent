spring:
  application:
    name: baedal-support-agent

  # -------------------------------------------------------------------
  # Round 4 — 기본 프로파일은 InMemory ChatMemory를 쓰므로 JDBC ChatMemory 자동구성을 끈다.
  #   PgVector용 datasource를 추가하면 JDBC ChatMemory auto-config가 깨어나
  #   ChatMemoryRepository 빈이 InMemory와 둘로 충돌한다. jdbc 프로파일에서만 켠다.
  # -------------------------------------------------------------------
  autoconfigure:
    exclude:
      - org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration

  # -------------------------------------------------------------------
  # Round 4 — PgVector 연결 (docker-compose.yml 참조)
  #   db: baedal / user: baedal / password: baedal / port: 5432
  #   기본 프로파일은 InMemory ChatMemory + PgVector RAG 조합으로 돈다.
  #   (JDBC ChatMemory(H2)는 'jdbc' 프로파일에서만 — application-jdbc.yml)
  # -------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/baedal
    username: baedal
    password: baedal
    driver-class-name: org.postgresql.Driver
    # Round 6 — 기본값(30s)이면 PgVector가 죽었을 때 요청마다 30초를 기다린 뒤 실패한다.
    # 검색은 fail-soft로 넘기므로 빨리 포기하는 편이 낫다. (관찰은 docs/6주차/01)
    hikari:
      connection-timeout: 2000

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        # Tool Calling이 필요하므로 tools capability가 있는 gemma4를 쓴다 (gemma3는 Ollama에서 tools 미지원).
        # 사용 전: ollama pull gemma4
        model: gemma4
        options:
          temperature: 0.3
      # 임베딩도 Gemma 계열로 맞춘다. 사용 전: ollama pull embeddinggemma
      # qwen3-embedding:0.6b(1024차원)에서 바꾸면 vector_store 테이블을 지우고 다시 적재해야 한다.
      embedding:
        model: embeddinggemma

    # -------------------------------------------------------------------
    # Round 4 — PgVector 설정
    #   initialize-schema=true → 기동 시 vector_store 테이블/확장 자동 생성
    #   dimensions는 임베딩 모델 차원과 반드시 일치 (embeddinggemma → 768)
    # -------------------------------------------------------------------
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

logging:
  level:
    org.springframework.ai: DEBUG
    com.baedal: DEBUG

server:
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
